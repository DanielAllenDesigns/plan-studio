[package]
name = "plan-calib"
description = "Plan Studio: read-only reader for Chief Architect .calib (SQLite) and .calibz (zip) library catalogs, used at runtime against the user's own licensed Chief installation."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plan-3d = { path = "../plan-3d" }
plan-core = { path = "../plan-core" }
plan-library = { path = "../plan-library" }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# Force the portable seek+read file backend even on Unix (normally positioned
# reads via `std::os::unix::fs::FileExt` are used there). Mostly for testing
# the non-Unix code path.
seek-io = []
