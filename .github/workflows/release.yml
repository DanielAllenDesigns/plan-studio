name: Release

# Pushing a tag such as v0.1.0 checks the tag against the workspace version and
# CHANGELOG.md, runs the whole test suite on Linux, macOS and Windows, then builds
# macOS (arm64 and x86_64 disk images and zips), Windows (zip) and Linux (tarball,
# plus an AppImage when appimagetool can be fetched), and attaches everything to a
# GitHub Release whose notes are the CHANGELOG section for that version. Tags with
# a hyphen (v0.2.0-rc1) are marked pre-release. Nothing is published unless every
# job before the last one succeeded. The steps are described in
# docs/release-checklist.md.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Cheap checks first: a tag that does not match Cargo.toml or has no changelog
  # section fails in seconds, before any runner compiles anything.
  verify:
    name: verify tag, changelog, packaging scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sh scripts/version.sh)"
          base="${TAG#v}"
          base="${base%%-*}"
          if [ "$base" != "$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version in Cargo.toml"
            exit 1
          fi
      - name: CHANGELOG has a section for this version
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/release-notes.sh "$TAG" > /dev/null
      - name: Packaging scripts self-test
        run: bash scripts/test-packaging.sh

  test:
    name: test (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-test
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      # A tag on a broken commit must not publish: the packages are built only
      # after the suite passes on all three operating systems.
      - run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Build plan-app (release)
        run: cargo build --release --locked -p plan-app --target ${{ matrix.target }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # macos-bundle.sh reads $CARGO_TARGET_DIR/release/plan-studio, but a
          # --target build lands in target/<triple>/release, so stage it.
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/release" dist
          cp "target/$TARGET/release/plan-studio" "$stage/release/plan-studio"
          CARGO_TARGET_DIR="$stage" sh scripts/macos-bundle.sh release "$PWD/dist"
          cd dist
          codesign --force --deep -s - "Plan Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "Plan Studio.app" "plan-studio-$TAG-$NAME.zip"
          # The disk image: the signed app plus an Applications shortcut.
          sh ../scripts/macos-dmg.sh "$PWD" "$PWD" "plan-studio-$TAG-$NAME.dmg"
          rm -rf "Plan Studio.app"

      # "Plan Studio-<version>-windows-x64.zip": the exe, an .ico and a README.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/windows-package.sh "target/$TARGET/release/plan-studio.exe" dist

      # The AppImage is best effort: appimagetool is fetched from its GitHub
      # release, and if that fails the tarball is still published.
      - name: Fetch appimagetool (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          label="plan-studio-$TAG-$NAME"
          # The tarball is written before the AppImage step, so a failure there
          # leaves a usable tarball and only costs the AppImage.
          bash scripts/linux-appimage.sh "target/$TARGET/release/plan-studio" dist "$label" \
            || echo "::warning::AppImage step failed; publishing the tarball only"
          test -f "dist/$label.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: plan-studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: plan-studio-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          sh scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          cat scripts/release-footer.md >> "$RUNNER_TEMP/notes.md"
      # GitHub turns spaces in asset names into dots; do it here so the names
      # in SHA256SUMS.txt are the names people download.
      - name: Normalize names and write checksums
        working-directory: dist
        run: |
          for f in *\ *; do [ -e "$f" ] && mv "$f" "$(printf '%s' "$f" | tr ' ' '.')"; done
          sha256sum * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          name: Plan Studio ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/*
            samples/*.psplan
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
