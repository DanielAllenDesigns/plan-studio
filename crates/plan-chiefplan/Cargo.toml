[package]
name = "plan-chiefplan"
description = "Plan Studio: read-only reader for Chief Architect .plan/.layout files: template names and values (layer sets, wall types, text styles, dimension sets) to seed Plan Studio templates, and an importer that turns a project .plan (floors, walls, doors, windows, room names, dimensions, text) into a plan_core Project."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
plan-core = { path = "../plan-core" }
serde = { workspace = true }
serde_json = { workspace = true }
