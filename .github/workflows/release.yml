name: Release

# Pushing a tag such as v0.1.0 builds Plan Studio for macOS (arm64 and
# x86_64), Windows and Linux, then attaches the packages to a GitHub Release
# with generated notes. Tags with a hyphen (v0.2.0-rc1) are marked pre-release.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      NAME: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Build plan-app (release)
        run: cargo build --release -p plan-app --target ${{ matrix.target }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # macos-bundle.sh reads $CARGO_TARGET_DIR/release/plan-studio, but a
          # --target build lands in target/<triple>/release, so stage it.
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/release" dist
          cp "target/$TARGET/release/plan-studio" "$stage/release/plan-studio"
          CARGO_TARGET_DIR="$stage" sh scripts/macos-bundle.sh release "$PWD/dist"
          cd dist
          codesign --force --deep -s - "Plan Studio.app"
          ditto -c -k --sequesterRsrc --keepParent "Plan Studio.app" "plan-studio-$TAG-$NAME.zip"
          rm -rf "Plan Studio.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/plan-studio.exe" -DestinationPath "dist/plan-studio-$env:TAG-$env:NAME.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pkg="plan-studio-$TAG-$NAME"
          mkdir -p "dist/$pkg"
          cp "target/$TARGET/release/plan-studio" "dist/$pkg/"
          cp scripts/linux/plan-studio.desktop "dist/$pkg/"
          tar -C dist -czf "dist/$pkg.tar.gz" "$pkg"
          rm -rf "dist/$pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: plan-studio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: plan-studio-*
          path: dist
          merge-multiple: true
      - name: List packages
        run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            samples/*.psplan
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
