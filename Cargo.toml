[workspace]
resolver = "2"
members = ["crates/plan-core", "crates/plan-app", "crates/plan-3d", "crates/plan-roof", "crates/plan-docs", "crates/plan-library", "crates/plan-view3d", "crates/plan-stairs", "crates/plan-cabinets", "crates/plan-framing", "crates/plan-import", "crates/plan-elevation", "crates/plan-config", "crates/plan-terrain", "crates/plan-materials", "crates/plan-layout", "crates/plan-electrical", "crates/plan-spaceplan", "crates/plan-check", "crates/plan-render", "crates/plan-calib", "crates/plan-chiefplan", "crates/plan-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1          # keep the editor responsive even in debug builds

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Not `panic = "abort"`: the 3D view renders on worker threads and recovers
# from a panic there with `catch_unwind` (shell/view3d_panel.rs); aborting would
# turn that into a crash of the whole editor. See docs/performance.md.
