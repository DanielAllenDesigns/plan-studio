[workspace]
resolver = "2"
members = ["crates/plan-core", "crates/plan-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1          # keep the editor responsive even in debug builds

[profile.release]
lto = "thin"
codegen-units = 1
