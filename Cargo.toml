[workspace]
resolver = "2"
members = ["crates/plan-core", "crates/plan-app", "crates/plan-3d", "crates/plan-roof", "crates/plan-docs", "crates/plan-library", "crates/plan-view3d", "crates/plan-stairs", "crates/plan-cabinets", "crates/plan-framing", "crates/plan-import", "crates/plan-elevation", "crates/plan-config"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1          # keep the editor responsive even in debug builds

[profile.release]
lto = "thin"
codegen-units = 1
